<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — FocusLab</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <aside class="auth-side">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt="" style="filter:brightness(0) invert(.92)">FOCUSLAB</a>
      <div>
        <h2>Start your first experiment.</h2>
        <p>Create a free account to track focus sessions, finish tasks and grow your garden.</p>
      </div>
      <svg class="leaf-deco" viewBox="0 0 24 24" fill="none" stroke="#f1efe2" stroke-width="1" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
    </aside>

    <main class="auth-form-wrap">
      <form class="auth-form" id="signupForm" novalidate>
        <a class="back-link" href="index.html">&larr; Back to home</a>
        <h1>Create your account</h1>
        <p>It takes less than a minute.</p>
        <div id="msg"></div>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" type="text" autocomplete="name" required placeholder="Your name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button class="btn btn-primary btn-block" id="submitBtn" type="submit">Create account</button>
        <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
